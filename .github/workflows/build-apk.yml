name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Prepare Build Environment
        run: |
          # Ensure .env exists for Secrets Gradle plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Restore debug keystore from base64 if present, or generate a valid debug keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || openssl base64 -d -A -in debug.keystore.base64 -out debug.keystore 2>/dev/null || true
          fi

          if [ ! -s debug.keystore ]; then
            echo "Creating fresh debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure release keystore exists for CI signing if custom keystore not provided
          if [ ! -s my-upload-key.jks ] && [ -z "$KEYSTORE_PATH" ]; then
            echo "Creating upload keystore for CI release build..."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Pocket,O=Pocket,C=US"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

          echo "Keystore setup verified:"
          ls -la debug.keystore my-upload-key.jks

      - name: Build APKs with Gradle
        run: gradle assembleRelease assembleDebug --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.KEY_PASSWORD }}

      - name: Rename APKs for Release
        run: |
          mkdir -p release-apks
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk release-apks/pocket-release.apk
          fi
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            cp app/build/outputs/apk/debug/*.apk release-apks/pocket-debug.apk
          fi
          ls -la release-apks/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-release-apk
          path: release-apks/pocket-release.apk
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-debug-apk
          path: release-apks/pocket-debug.apk
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pocket App Release v1.0.${{ github.run_number }}
          body: |
            ## Pocket Android App Build
            - Automatic build for commit `${{ github.sha }}`
            - **pocket-release.apk**: Production signed APK
            - **pocket-debug.apk**: Debug APK with logging enabled
          files: |
            release-apks/pocket-release.apk
            release-apks/pocket-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

